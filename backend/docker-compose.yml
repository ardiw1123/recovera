services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recovera_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Recovera API
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+psycopg2://recovera_user:recovera_pass@db:5432/recovera_db
      - SECRET_KEY=recovera-super-secret-development-key-change-in-production-1234567890
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    container_name: recovera_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recovera_user
      POSTGRES_PASSWORD: recovera_pass
      POSTGRES_DB: recovera_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovera_user -d recovera_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
