<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <clipPath id="meter-fill-clip">
      <rect x="368" y="80" width="44" height="160" rx="22" ry="22" />
    </clipPath>
  </defs>

  <!-- 1. APPLE -->
  <g id="apple">
    <!-- Stem -->
    <path d="M 124 122 C 122 108 126 96 134 90" fill="none" stroke="#03045E" stroke-width="3" stroke-linecap="round" />
    <!-- Leaf -->
    <path d="M 125 116 C 130 98 152 100 155 108 C 150 122 130 124 125 116 Z" fill="#10B981" stroke="#03045E" stroke-width="3" stroke-linejoin="round" />
    <!-- Apple Body -->
    <path d="M 122 130 C 108 114 74 114 62 136 C 46 164 48 206 72 226 C 90 240 108 234 122 227 C 136 234 154 240 172 226 C 196 206 198 164 182 136 C 170 114 136 114 122 130 Z" fill="#EF4444" stroke="#03045E" stroke-width="3" stroke-linejoin="round" />
    <!-- Clean Gloss Arc -->
    <path d="M 76 142 C 67 155 66 177 72 196" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 2. SANDWICH (Side view: rounded top bread, green lettuce layer, rounded bottom bread) -->
  <g id="sandwich">
    <!-- Bottom Bread Slice Crust -->
    <rect x="216" y="206" width="112" height="24" rx="12" ry="12" fill="#F59E0B" stroke="#03045E" stroke-width="3" stroke-linejoin="round" />
    <!-- Bottom Bread Slice Interior/Crumb -->
    <rect x="222" y="211" width="100" height="14" rx="7" ry="7" fill="#FFFFFF" />

    <!-- Lettuce Layer (Wavy fresh green filling extending slightly wider) -->
    <path d="M 210 197 C 213 189 221 189 225 197 C 229 189 237 189 241 197 C 245 189 253 189 257 197 C 261 189 269 189 273 197 C 277 189 285 189 289 197 C 293 189 301 189 305 197 C 309 189 317 189 321 197 C 325 189 333 189 336 197 C 336 203 331 207 325 207 L 221 207 C 215 207 210 203 210 197 Z" fill="#10B981" stroke="#03045E" stroke-width="3" stroke-linejoin="round" />

    <!-- Top Bread Slice Crust -->
    <rect x="216" y="164" width="112" height="24" rx="12" ry="12" fill="#F59E0B" stroke="#03045E" stroke-width="3" stroke-linejoin="round" />
    <!-- Top Bread Slice Interior/Crumb -->
    <rect x="222" y="169" width="100" height="14" rx="7" ry="7" fill="#FFFFFF" />
    <!-- Soft bread crust highlight -->
    <path d="M 228 171 L 280 171" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- 3. ENERGY METER (Clean vertical pill bar filled ~3/4, rounded track and rounded fill cap) -->
  <g id="meter">
    <!-- Meter Track Background -->
    <rect x="368" y="80" width="44" height="160" rx="22" ry="22" fill="#E2E8F0" stroke="#0077B6" stroke-width="3" />
    
    <!-- Energy Fill: ~75% (120px height of 160px, bottom at y=240, top at y=120) -->
    <g clip-path="url(#meter-fill-clip)">
      <rect x="368" y="120" width="44" height="120" rx="22" ry="22" fill="#10B981" stroke="#03045E" stroke-width="3" />
    </g>

    <!-- Clean Track Re-stroke to keep crisp perimeter -->
    <rect x="368" y="80" width="44" height="160" rx="22" ry="22" fill="none" stroke="#0077B6" stroke-width="3" />
  </g>
</svg>