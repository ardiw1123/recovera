name: recovera
description: "Recovera B2B Near-Expiry Food Liquidation & Diversion Mobile App."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.4+1
  supabase_flutter: ^2.18.2

  # Fonts
  google_fonts: ^6.2.1

  # Networking
  dio: ^5.7.0

  # Secure Storage for JWT tokens
  flutter_secure_storage: ^9.2.2

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^14.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
