name: recovera
description: "Recovera B2B Near-Expiry Food Liquidation & Diversion Mobile App."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.4+1

  # Fonts
  google_fonts: ^6.2.1

  # Networking
  dio: ^5.7.0

  # Secure Storage for JWT tokens
  flutter_secure_storage: ^9.2.2

  # Biometric Authentication
  local_auth: ^2.3.0

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^14.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^13.0.2
  http: ^1.2.2
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.1
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  permission_handler: 12.0.1
  path_provider: ^2.1.6
  camera: ^0.12.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  flutter_svg: ^2.3.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
    - assets/audio/
